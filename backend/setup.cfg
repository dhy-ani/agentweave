# Test tooling configuration only. setup.cfg (rather than pyproject.toml) is
# used so the Vercel Python builder keeps installing from requirements.txt.

[tool:pytest]
testpaths = tests
markers =
    models: needs the real ONNX model files in ai/models (skipped when they are absent)
filterwarnings =
    # SQLAlchemy column defaults in db/models.py call datetime.utcnow.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning

[coverage:run]
branch = True
source = .
omit =
    tests/*
    mutants/*
    scripts/*
    generate_faiss_data.py
    update_index_to_caption.py
    ai/export_onnx.py
    ai/clip_torch.py
    ai/finetune_clip_lora.py
    ai/train_classifier.py
    ai/tune_*.py
    ai/evaluate_retrieval.py
    ai/embedding_cache.py
    ai/data_split.py
    ai/build_corpus_embeddings.py
    ai/onnx_parity.py
    ai/calibrate_scores.py
    ai/extract_vector.py
    ai/search_similar.py
    ai/recommend_trend.py
    ai/trend_radar.py
    ai/caption_images.py
    ai/cluster_images.py
    ai/average_cluster.py
    ai/generate_trend_vector.py
    ai/generate_timestamps.py

[coverage:report]
show_missing = True
skip_covered = False

[mutmut]
# mutmut 3.x. Serving modules only; training / export scripts are excluded.
source_paths =
    ai/
    routers/
    settings.py
    storage.py
    image_io.py
only_mutate =
    ai/retrieval.py
    ai/score_calibration.py
    ai/body_shape_classifier.py
    ai/artifacts.py
    ai/onnx_inference.py
    ai/model_cache.py
    routers/shopping.py
    routers/stylegenie.py
    settings.py
    storage.py
    image_io.py
also_copy =
    db/
    main.py
pytest_add_cli_args =
    -m
    not models
    -p
    no:cacheprovider
